<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHADOW MAZE</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    overflow:hidden;

    background:#050509;

    font-family:Arial,Helvetica,sans-serif;
    color:white;
}


/* BACKGROUND */

.background{
    position:fixed;
    inset:0;

    background:
        radial-gradient(
            circle at center,
            rgba(20,20,100,.25),
            transparent 55%
        ),
        #050509;
}


/* MAZE LINES */

.maze{
    position:absolute;
    inset:0;

    opacity:.35;
}

.line{
    position:absolute;

    background:#3030ff;

    box-shadow:
        0 0 8px #3030ff;
}

.h1{
    width:75%;
    height:3px;
    top:18%;
    left:12.5%;
}

.h2{
    width:55%;
    height:3px;
    top:38%;
    left:22.5%;
}

.h3{
    width:75%;
    height:3px;
    top:62%;
    left:12.5%;
}

.h4{
    width:55%;
    height:3px;
    top:82%;
    left:22.5%;
}

.v1{
    width:3px;
    height:55%;
    left:18%;
    top:22%;
}

.v2{
    width:3px;
    height:35%;
    left:38%;
    top:32%;
}

.v3{
    width:3px;
    height:55%;
    right:18%;
    top:22%;
}

.v4{
    width:3px;
    height:35%;
    right:38%;
    top:32%;
}


/* DOTS */

.dot{
    position:absolute;

    width:7px;
    height:7px;

    border-radius:50%;

    background:#fff;

    box-shadow:
        0 0 8px white;

    animation:blink 1.5s infinite alternate;
}

.d1{left:15%;top:30%;}
.d2{left:25%;top:50%;}
.d3{left:42%;top:22%;}
.d4{right:25%;top:50%;}
.d5{right:15%;top:30%;}

@keyframes blink{
    from{opacity:.35;}
    to{opacity:1;}
}


/* MAIN MENU */

.menu{
    position:relative;

    z-index:5;

    width:100%;
    height:100vh;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    text-align:center;
}


/* SMALL TITLE */

.small{
    font-size:11px;

    letter-spacing:6px;

    color:#7777ff;

    margin-bottom:14px;

    text-transform:uppercase;
}


/* TITLE */

.title{
    font-size:clamp(55px,13vw,110px);

    font-weight:900;

    letter-spacing:7px;

    color:#ffd92f;

    text-shadow:
        0 0 5px #ffd92f,
        0 0 25px rgba(255,217,47,.35);
}


/* SUBTITLE */

.subtitle{
    margin-top:8px;

    font-size:12px;

    letter-spacing:5px;

    color:#777;

    text-transform:uppercase;
}


/* DIVIDER */

.divider{
    width:110px;
    height:3px;

    margin:28px 0 32px;

    background:#3030ff;

    box-shadow:
        0 0 12px #3030ff;
}


/* BUTTON */

.start{
    min-width:230px;

    padding:17px 30px;

    border:3px solid #3030ff;

    border-radius:8px;

    background:#08082a;

    color:white;

    font-size:13px;

    font-weight:900;

    letter-spacing:4px;

    cursor:pointer;

    box-shadow:
        0 0 12px rgba(48,48,255,.7),
        inset 0 0 15px rgba(48,48,255,.15);

    transition:.2s;
}

.start:hover{
    background:#3030ff;

    box-shadow:
        0 0 30px #3030ff;

    transform:scale(1.04);
}

.start:active{
    transform:scale(.96);
}


/* GHOSTS */

.ghosts{
    display:flex;

    gap:28px;

    margin-bottom:35px;
}

.ghost{
    width:28px;
    height:28px;

    border-radius:16px 16px 5px 5px;

    position:relative;
}

.ghost::after{
    content:"";

    position:absolute;

    width:7px;
    height:7px;

    background:white;

    border-radius:50%;

    left:5px;
    top:8px;

    box-shadow:
        11px 0 white;
}

.red{
    background:#ff304f;

    box-shadow:
        0 0 15px rgba(255,48,79,.6);
}

.cyan{
    background:#32e7ff;

    box-shadow:
        0 0 15px rgba(50,231,255,.6);
}

.pink{
    background:#ff65d4;

    box-shadow:
        0 0 15px rgba(255,101,212,.6);
}

.orange{
    background:#ff9d32;

    box-shadow:
        0 0 15px rgba(255,157,50,.6);
}


/* FOOTER */

.creator{
    position:absolute;

    bottom:25px;

    font-size:9px;

    letter-spacing:3px;

    color:#555;
}

.creator span{
    color:#7777ff;
}


/* MOBILE */

@media(max-width:600px){

    .title{
        font-size:58px;
        letter-spacing:5px;
    }

    .subtitle{
        font-size:9px;
        letter-spacing:3px;
    }

    .ghosts{
        gap:18px;
        margin-bottom:28px;
    }

    .ghost{
        width:23px;
        height:23px;
    }

    .start{
        min-width:210px;
    }

}

</style>
</head>


<body>

<div class="background">

    <div class="maze">

        <div class="line h1"></div>
        <div class="line h2"></div>
        <div class="line h3"></div>
        <div class="line h4"></div>

        <div class="line v1"></div>
        <div class="line v2"></div>
        <div class="line v3"></div>
        <div class="line v4"></div>

    </div>


    <div class="dot d1"></div>
    <div class="dot d2"></div>
    <div class="dot d3"></div>
    <div class="dot d4"></div>
    <div class="dot d5"></div>

</div>


<main class="menu">

    <div class="small">
        ARCADE ADVENTURE
    </div>

    <div class="title">
        SHADOW
    </div>

    <div class="subtitle">
        ENTER THE MAZE
    </div>

    <div class="divider"></div>


    <div class="ghosts">

        <div class="ghost red"></div>
        <div class="ghost cyan"></div>
        <div class="ghost pink"></div>
        <div class="ghost orange"></div>

    </div>


    <button class="start" onclick="startGame()">
        START GAME
    </button>


    <div class="creator">
        CREATED BY <span>REHAAN KHAN</span>
    </div>

</main>


<script>

function startGame(){

    window.location.href="game.html";

}

</script>

</body>
</html>
